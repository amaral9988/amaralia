<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="AmaraL IA — seu assistente inteligente.">
<title>AmaraL IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --surface:#151823; --line:#252a3a;
  --text:#eef0f6; --muted:#8d93a8;
  --accent:#8f8bff; --accent-ink:#0b0d12;
  --user:#232846;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
.app{
  height:100dvh;max-width:820px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.ghost{
  background:none;border:1px solid var(--line);color:var(--muted);
  font:inherit;font-size:.875rem;padding:8px 14px;border-radius:999px;cursor:pointer;
  min-height:40px;
}
.ghost:hover{color:var(--text);border-color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{flex:1;overflow-y:auto;padding:20px 18px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:24px}
.empty h1{font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.15;letter-spacing:-.02em;font-weight:700;max-width:14em}
.empty p{color:var(--muted);max-width:30em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  font:inherit;font-size:.9rem;padding:10px 14px;border-radius:14px;cursor:pointer;text-align:left;
}
.chip:hover{border-color:var(--accent)}

.msg{display:flex;margin-bottom:14px}
.msg .bubble{
  max-width:min(85%,620px);padding:11px 15px;border-radius:18px;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--user);border-bottom-right-radius:6px}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err .bubble{border-color:#6b3040;color:#ffb4c0}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

.composer{
  display:flex;gap:10px;align-items:flex-end;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--bg);
}
textarea{
  flex:1;resize:none;max-height:150px;min-height:48px;
  background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:24px;padding:12px 18px;font:inherit;font-size:16px; /* 16px evita zoom no iPhone */
}
textarea::placeholder{color:var(--muted)}
.send{
  width:48px;height:48px;flex:none;border:0;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;
  display:grid;place-items:center;
}
.send:disabled{opacity:.4;cursor:default}
.send svg{width:20px;height:20px}

@media (min-width:700px){
  header{padding:18px 28px}
  main{padding:28px}
  .composer{padding-left:28px;padding-right:28px}
  .msg .bubble{font-size:1.02rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Amara<span>L</span> IA</div>
    <button class="ghost" id="novo" type="button">Nova conversa</button>
  </header>

  <main id="chat" aria-live="polite">
    <div class="empty" id="empty">
      <h1>Olá! Como posso ajudar você hoje?</h1>
      <p>Pergunte qualquer coisa ou escolha uma sugestão para começar.</p>
      <div class="chips">
        <button class="chip" type="button">Me ajude a planejar meu dia</button>
        <button class="chip" type="button">Explique um assunto de forma simples</button>
        <button class="chip" type="button">Escreva uma mensagem para um cliente</button>
        <button class="chip" type="button">Dê ideias para o meu negócio</button>
      </div>
    </div>
  </main>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Escreva sua mensagem" aria-label="Mensagem" enterkeyhint="send"></textarea>
    <button class="send" id="send" type="button" aria-label="Enviar" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<script>
/* ===== CONFIGURAÇÃO =====
   Para a IA responder de verdade, aponte para um endpoint seu
   (ex.: uma Netlify Function em "/.netlify/functions/chat").
   NUNCA coloque a chave da API aqui no navegador.
   O endpoint deve receber { messages: [{role, content}] } e devolver { reply: "texto" }.
   Deixe vazio para rodar em modo demonstração. */
const API_URL = "/.netlify/functions/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let empty = document.getElementById("empty");
let history = [];
let busy = false;

function add(role, text, extra){
  if(empty){ empty.remove(); empty = null; }
  const row = document.createElement("div");
  row.className = "msg " + role + (extra ? " " + extra : "");
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function typing(){
  const row = add("bot","");
  row.firstChild.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  return row;
}

async function getReply(){
  if(!API_URL){
    await new Promise(r => setTimeout(r, 700));
    return "Modo demonstração: a interface está funcionando! Conecte um endpoint em API_URL para eu responder de verdade.";
  }
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages:history})
  });
  let data = {};
  try{ data = await res.json(); }catch(_){}
  if(!res.ok) throw new Error(data.reply || "Falha na resposta do servidor.");
  return data.reply || "Não recebi resposta. Tente de novo.";
}

async function send(text){
  text = text.trim();
  if(!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = ""; resize();
  add("user", text);
  history.push({role:"user", content:text});
  const t = typing();
  try{
    const reply = await getReply();
    t.remove();
    add("bot", reply);
    history.push({role:"assistant", content:reply});
  }catch(e){
    t.remove();
    const generic = "Não consegui responder agora. Verifique sua conexão e tente novamente.";
    add("bot", (e instanceof TypeError || !e.message) ? generic : e.message, "err");
  }
  busy = false; sendBtn.disabled = !input.value.trim();
}

function resize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,150) + "px";
  sendBtn.disabled = busy || !input.value.trim();
}

input.addEventListener("input", resize);
input.addEventListener("keydown", e => {
  // Enter envia no computador; no celular Enter quebra linha
  if(e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover:hover)").matches){
    e.preventDefault(); send(input.value);
  }
});
sendBtn.addEventListener("click", () => send(input.value));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => send(c.textContent)));
document.getElementById("novo").addEventListener("click", () => location.reload());
</script>
</body>
</html>
